<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Watch</title>
<style>
  :root {
    --bg: #0d1016;
    --bg-2: #10141b;
    --card: #131820;
    --card-hover: #161c26;
    --line: #232a36;
    --line-2: #2d3542;
    --text: #e7eaf0;
    --dim: #8e96a5;
    --faint: #5f6776;
    --green: #3fb950;
    --amber: #f0a020;
    --grey: #8e96a5;
    --red: #f85149;
    --accent: #d97757;
    --mono: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--mono);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  .muted { color: var(--dim); }
  .faint { color: var(--faint); }

  /* header */
  header {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-right: auto; }
  .brand svg { flex: none; }
  .brand h1 { margin: 0; font-size: 21px; letter-spacing: .08em; font-weight: 700; }
  .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--dim); }
  .tally { display: flex; align-items: center; flex-wrap: wrap; }
  .tally button { display: flex; align-items: center; gap: 8px; padding: 4px 14px; border-left: 1px solid var(--line); font-size: 14.5px; }
  .tally button:first-child { border-left: 0; }
  .tally button:hover { color: var(--text); background: var(--bg-2); border-radius: 6px; }
  .tally .zero { color: var(--dim); }
  .refresh { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
  .refresh button.kbd { padding: 2px 8px; }
  .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--dim); }
  .icon-btn:hover { background: var(--bg-2); color: var(--text); }

  /* dots and badges */
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent); background: currentColor; }
  .dot.big { width: 13px; height: 13px; }
  .sq { width: 10px; height: 10px; border-radius: 2px; background: currentColor; flex: none; }
  .running { color: var(--green); } .waiting { color: var(--amber); } .idle { color: var(--grey); } .ended { color: var(--red); }
  .badge {
    display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 4px; font-size: 11.5px; letter-spacing: .04em;
    border: 1px solid color-mix(in srgb, currentColor 45%, transparent);
    background: color-mix(in srgb, currentColor 13%, transparent);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 5px; font-size: 12.5px;
    background: var(--bg-2); border: 1px solid var(--line); color: var(--dim);
  }
  .kbd {
    display: inline-grid; place-items: center; min-width: 28px; height: 26px; padding: 0 7px; border-radius: 5px;
    border: 1px solid var(--line-2); background: var(--bg-2); font-size: 12px; color: var(--text);
  }

  /* layout */
  .layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
  main { padding: 20px 24px; overflow: auto; }
  aside { border-left: 1px solid var(--line); padding: 22px 22px; overflow: auto; }
  @media (max-width: 1000px) {
    .layout { display: block; overflow: auto; }
    main, aside { overflow: visible; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }

  /* cards */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 18px 20px; margin-bottom: 16px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 8px 28px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .card:hover { background: var(--card-hover); border-color: var(--line-2); }
  .card.alert { border-color: var(--amber); box-shadow: inset 3px 0 0 var(--amber); }
  .card.single { grid-template-columns: 1fr; }
  @media (max-width: 780px) { .card { grid-template-columns: 1fr; } }
  .card-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .card-head .name { font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { display: flex; align-items: center; justify-content: flex-end; gap: 18px; color: var(--dim); font-size: 13px; min-width: 0; }
  .card-meta .path { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .card-meta .path span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: 16px; margin: 10px 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .callout {
    margin-top: 14px; padding: 12px 14px; border-radius: 7px; display: flex; gap: 12px; align-items: flex-start;
    border: 1px solid color-mix(in srgb, var(--amber) 60%, transparent);
    background: color-mix(in srgb, var(--amber) 8%, transparent);
  }
  .callout .bang { width: 20px; height: 20px; border-radius: 50%; background: var(--amber); color: #111; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
  .callout b { color: var(--amber); font-weight: 600; display: block; }
  .callout span { color: var(--dim); font-size: 13px; }
  .idle-note { margin-top: 12px; color: var(--faint); font-size: 13px; }

  /* agent table */
  .agents { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); align-self: start; }
  .agent {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 72px; gap: 12px; align-items: center;
    padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer;
  }
  .agent:first-child { border-top: 0; }
  .agent:hover { background: var(--bg-2); }
  .agent .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .what { grid-column: 2 / -1; margin-top: -6px; font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent time { color: var(--dim); text-align: right; font-size: 13px; }
  .card .left, .card .right { min-width: 0; display: flex; flex-direction: column; }
  .card .right { gap: 12px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }

  /* pages */
  .crumbs { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; color: var(--dim); }
  .crumbs button:hover { color: var(--text); }
  .page-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .primary {
    margin-left: auto; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg-2);
  }
  .primary:hover { border-color: var(--accent); color: var(--accent); }
  .fields { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 16px 20px; margin-bottom: 22px; }
  .fields dt { color: var(--dim); } .fields dd { margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: 12px; letter-spacing: .14em; color: var(--dim); font-weight: 500; margin: 0 0 10px; }
  .timeline { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-bottom: 22px; }
  .timeline div { display: grid; grid-template-columns: 74px 110px 1fr; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13px; }
  .timeline div:first-child { border-top: 0; }
  .timeline time { color: var(--faint); } .timeline b { color: var(--green); font-weight: 600; }
  .timeline span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prose { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 16px 20px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 22px; font: inherit; font-size: 13px; }
  .empty { color: var(--faint); padding: 30px 0; }

  /* sidebar */
  aside h4 { margin: 0 0 12px; font-size: 12.5px; letter-spacing: .14em; color: var(--dim); font-weight: 500; }
  aside section { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  aside section:last-of-type { border-bottom: 0; }
  .filter, .setting { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 7px; font-size: 15px; }
  .filter:hover, .setting:hover { background: var(--bg-2); }
  .filter.on { background: #1a202b; border: 1px solid var(--line-2); }
  .filter .n { margin-left: auto; color: var(--dim); }
  .filter.on .n { color: var(--text); }
  .setting .v { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .shortcut { display: flex; align-items: center; gap: 14px; padding: 5px 2px; color: var(--dim); }
  .about { border: 1px solid var(--line); border-radius: 9px; padding: 16px; background: var(--bg-2); font-size: 12.5px; color: var(--dim); }
  .about b { color: var(--text); font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; }
  .about a { display: flex; gap: 6px; align-items: center; margin-top: 10px; text-decoration: none; }
  .about a:hover { color: var(--text); }

  /* footer */
  footer {
    display: flex; align-items: center; gap: 18px; padding: 12px 24px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--dim); background: var(--bg-2);
  }
  footer .sep { width: 1px; height: 14px; background: var(--line-2); }
  footer .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line-2);
    padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="24" viewBox="0 0 34 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12C6 4 12 2 17 2s11 2 15 10c-4 8-10 10-15 10S6 20 2 12Z"/><circle cx="17" cy="12" r="5"/></svg>
    <div><h1>AGENT WATCH</h1><p id="subtitle"></p></div>
  </div>
  <div class="tally" id="tally"></div>
  <div class="refresh">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13 5.5A5.5 5.5 0 1 0 13.5 9"/><path d="M13 1.5v4h-4"/></svg>
    <span id="refresh-label"></span>
    <button class="kbd" id="refresh-rate" title="Change"></button>
  </div>
  <button class="icon-btn" id="lang-btn" title="Language" aria-label="Language">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
  </button>
</header>
<div class="layout">
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<footer id="footer"></footer>
<div class="toast" id="toast"></div>

<script>
const T = {
  en: {
    subtitle: 'Monitor your Claude Code agents in real time',
    state: { running: 'Running', waiting: 'Waiting', idle: 'Idle', ended: 'Ended' },
    tally: { running: 'running', waiting: 'waiting', idle: 'idle', ended: 'ended' },
    autoRefresh: 'Auto refresh', off: 'off',
    since: a => `since ${a}`, endedAgo: a => `ended ${a} ago`,
    inputRequired: 'Permission / input required', waitingResp: 'Claude is waiting for your response…',
    turnOver: 'Turn over, waiting for your next message',
    here: 'here', agents: n => `${n} agent${n > 1 ? 's' : ''}`,
    filters: 'FILTERS', all: 'All sessions', settings: 'SETTINGS', language: 'Language', langName: 'English',
    refreshSetting: 'Auto refresh', shortcuts: 'SHORTCUTS', refresh: 'Refresh', toggleLang: 'Toggle language',
    filterKeys: 'Filters', back: 'Back', openSource: 'Open source · MIT License',
    allSessions: 'All sessions', open: 'Open in Claude ↗', opened: 'Opening the session in Claude…',
    folder: 'Folder', state2: 'State', for: 'For', waitingOn: 'Waiting on', doing: 'Doing', id: 'Session id',
    subagents: n => `SUBAGENTS · ${n}`, noAgents: 'No subagents.', task: 'TASK', tools: 'LAST TOOL CALLS',
    words: 'LAST WORDS', loading: 'Reading its transcript…', nothing: 'Nothing yet.', noSessions: 'No sessions found.',
    noMatch: 'No session matches this filter.', notifications: 'Notifications', footRefresh: r => `Auto refresh: ${r}`,
    noBoard: 'Waiting for the mod to write the board… (open /agent-watch in a Claude Code session)',
    unreadable: 'Its transcript could not be read.',
  },
  fr: {
    subtitle: 'Surveille tes agents Claude Code en temps réel',
    state: { running: 'En cours', waiting: 'En attente', idle: 'Inactif', ended: 'Terminé' },
    tally: { running: 'en cours', waiting: 'en attente', idle: 'inactifs', ended: 'terminés' },
    autoRefresh: 'Actualisation', off: 'off',
    since: a => `depuis ${a}`, endedAgo: a => `terminé il y a ${a}`,
    inputRequired: 'Permission / réponse requise', waitingResp: 'Claude attend ta réponse…',
    turnOver: 'Tour terminé, attend ton prochain message',
    here: 'ici', agents: n => `${n} agent${n > 1 ? 's' : ''}`,
    filters: 'FILTRES', all: 'Toutes les sessions', settings: 'RÉGLAGES', language: 'Langue', langName: 'Français',
    refreshSetting: 'Actualisation', shortcuts: 'RACCOURCIS', refresh: 'Actualiser', toggleLang: 'Changer de langue',
    filterKeys: 'Filtres', back: 'Retour', openSource: 'Open source · Licence MIT',
    allSessions: 'Toutes les sessions', open: 'Ouvrir dans Claude ↗', opened: 'Ouverture de la session dans Claude…',
    folder: 'Dossier', state2: 'État', for: 'Depuis', waitingOn: 'Attend', doing: 'En train de', id: 'Id de session',
    subagents: n => `SOUS-AGENTS · ${n}`, noAgents: 'Aucun sous-agent.', task: 'TÂCHE', tools: 'DERNIERS OUTILS',
    words: 'DERNIERS MOTS', loading: 'Lecture du transcript…', nothing: 'Rien pour l’instant.', noSessions: 'Aucune session trouvée.',
    noMatch: 'Aucune session pour ce filtre.', notifications: 'Notifications', footRefresh: r => `Actualisation : ${r}`,
    noBoard: 'En attente du mod… (ouvre /agent-watch dans une session Claude Code)',
    unreadable: 'Impossible de lire son transcript.',
  },
}
const RATES = [3000, 10000, 0]
const RANK = { waiting: 0, running: 1, idle: 2, ended: 3 }
const FILTERS = ['all', 'running', 'waiting', 'idle', 'ended']

const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v) } catch { return null } }
let board = null, filter = 'all', route = { view: 'list' }, timer = null, lastError = null
let lang = store('aw.lang'), rate = Number(store('aw.rate') ?? 3000)
const details = new Map()

const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const t = () => T[lang] ?? T.en
// The mod writes with this machine's clock: the page reads the same one.
const now = () => Date.now()
const clock = ms => {
  const s = Math.max(0, Math.round(ms / 1000))
  if (s < 60) return `${s}s`
  const m = Math.floor(s / 60)
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`
}
const pretty = p => {
  const path = String(p).replace(/\\/g, '/').replace(/\/$/, '')
  const home = (board?.home ?? '').replace(/\\/g, '/')
  return home && path.toLowerCase().startsWith(home.toLowerCase()) ? '~' + path.slice(home.length) : path
}
const cutStart = (text, max) => text.length > max ? '…' + text.slice(text.length - max + 1) : text
const folderName = p => (String(p).replace(/\\/g, '/').split('/').filter(Boolean).pop() ?? p).replace(/:$/, ':')
const agentState = a => a.waiting ? 'waiting' : a.status === 'running' || a.status === 'pending' ? 'running' : a.status === 'waiting' ? 'waiting' : a.status === 'idle' ? 'idle' : 'ended'
const live = c => [c.state, ...c.agents.map(agentState)].sort((x, y) => RANK[x] - RANK[y])[0]
const dot = (s, big) => `<span class="dot ${big ? 'big' : ''} ${s}"></span>`
const badge = (s, label) => `<span class="badge ${s}">${esc(label ?? t().state[s].toUpperCase())}</span>`
const tick = (from, kind) => `<span class="tick" data-from="${Number(from)}" data-kind="${kind}"></span>`
const elapsed = a => a.startedAt == null ? '' : agentState(a) === 'ended'
  ? clock((a.endedAt ?? a.startedAt) - a.startedAt)
  : tick(a.startedAt, 'plain')
function updateTicks() {
  const L = t()
  for (const el of document.querySelectorAll('.tick')) {
    const span = clock(now() - Number(el.dataset.from))
    const text = el.dataset.kind === 'since' ? L.since(span) : el.dataset.kind === 'ended' ? L.endedAgo(span) : span
    if (el.textContent !== text) el.textContent = text
  }
}
const paint = (id, html) => { const el = $(id); if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html } }

function go(to) {
  route = to
  if (to.view === 'agent') loadDetail(to.sessionId, to.agentId)
  const hash = to.view === 'list' ? '' : to.view === 'session' ? `#s/${encodeURIComponent(to.sessionId)}` : `#a/${encodeURIComponent(to.sessionId)}/${encodeURIComponent(to.agentId)}`
  if (location.hash !== hash) history.pushState(null, '', hash || location.pathname)
  render()
  $('main').scrollTop = 0
}

async function loadDetail(sessionId, agentId) {
  const key = `${sessionId}/${agentId}`
  if (!details.has(key)) details.set(key, { loading: true })
  try {
    const r = await fetch(`/api/agent?session=${encodeURIComponent(sessionId)}&agent=${encodeURIComponent(agentId)}`)
    details.set(key, await r.json())
  } catch (e) { details.set(key, { error: String(e) }) }
  if (route.view === 'agent') render()
}

async function openSession(hostId) {
  toast(t().opened)
  await fetch(`/api/open?host=${encodeURIComponent(hostId)}`, { method: 'POST' }).catch(() => {})
}

function toast(text) {
  const el = $('toast'); el.textContent = text; el.classList.add('show')
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200)
}

async function refresh() {
  try {
    const r = await fetch('/api/board', { cache: 'no-store' })
    if (!r.ok) throw new Error(r.status)
    board = await r.json()
    lastError = null
    if (!lang) lang = board.language === 'fr' ? 'fr' : 'en'
    if (route.view === 'agent') loadDetail(route.sessionId, route.agentId)
  } catch (e) { lastError = e }
  render()
}

function schedule() {
  clearInterval(timer)
  if (rate > 0) timer = setInterval(refresh, rate)
}

/* ── rendering ───────────────────────────────────────────── */
function render() {
  const L = t()
  document.documentElement.lang = lang ?? 'en'
  $('subtitle').textContent = L.subtitle
  $('refresh-label').textContent = L.autoRefresh
  $('refresh-rate').textContent = rate ? `${rate / 1000}s` : L.off
  const sessions = board?.sessions ?? []
  const counts = { running: 0, waiting: 0, idle: 0, ended: 0 }
  for (const c of sessions) counts[live(c)]++
  paint('tally', ['running', 'waiting', 'idle', 'ended'].map(s =>
    `<button data-filter="${s}" class="${counts[s] ? '' : 'zero'}">${s === 'ended' ? `<span class="sq ${s}"></span>` : dot(s)}<span class="${counts[s] && (s === 'running' || s === 'waiting') ? s : ''}">${counts[s]} ${L.tally[s]}</span></button>`).join(''))

  let html
  if (!board) html = `<div class="empty">${esc(lastError ? L.noBoard : L.loading)}</div>`
  else if (route.view === 'agent') html = agentPage()
  else if (route.view === 'session') html = sessionPage()
  else html = listPage(sessions)
  paint('main', html)
  paint('side', sidebar(sessions, counts))

  let running = 0, waiting = 0
  for (const c of sessions) for (const s of [c.state, ...c.agents.map(agentState)]) { if (s === 'running') running++; if (s === 'waiting') waiting++ }
  paint('footer', `${dot('running')}<span>${esc(L.footRefresh(rate ? rate / 1000 + 's' : L.off))}</span><span class="sep"></span>
    <span>v${esc(board?.version ?? '')}</span>
    <span class="end">${dot('running')}<span>${running} ${L.tally.running}</span><span>·</span><span class="waiting">${waiting} ${L.tally.waiting}</span></span>`)
  updateTicks()
}

const FOLDER = '<svg width="15" height="13" viewBox="0 0 15 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1 2.5h4.5l1.5 1.5h7v7.5H1z"/></svg>'

function card(c) {
  const L = t(), s = live(c), mine = c.sessionId === board.mine
  const when = c.state === 'ended' ? tick(c.updatedAt, 'ended') : tick(c.since, 'since')
  const chips = [`<span class="chip">◈ Claude</span>`]
  if (mine) chips.push(`<span class="chip">${L.here}</span>`)
  if (c.state === 'running' && c.tool) chips.push(`<span class="chip">▸ ${esc(c.tool)}</span>`)
  if (c.agents.length) chips.push(`<span class="chip">${L.agents(c.agents.length)}</span>`)
  const status = c.state === 'waiting'
    ? `<div class="callout"><span class="bang">!</span><div><b>${L.inputRequired}</b><span>${esc(c.waiting ? `${c.waiting} · ${L.waitingResp}` : L.waitingResp)}</span></div></div>`
    : c.state === 'idle' && !c.agents.length ? `<div class="idle-note">○ ${L.turnOver}</div>` : ''
  const meta = `<div class="card-meta"><span>${when}</span><span class="path" title="${esc(pretty(c.cwd))}">${FOLDER}<span>${esc(cutStart(pretty(c.cwd), 42))}</span></span></div>`
  const head = `<div class="card-head">${dot(s, true)}<span class="name">${esc(folderName(c.cwd))}</span>${badge(s)}</div>`
  const left = `<div class="left">${c.agents.length ? head : `<div class="head-row">${head}${meta}</div>`}
      <div class="title">${esc(c.title || '—')}</div><div class="chips">${chips.join('')}</div>${status}</div>`
  const right = c.agents.length
    ? `<div class="right">${meta}<div class="agents">${c.agents.map(a => agentRow(c, a)).join('')}</div></div>`
    : ''
  return `<article class="card ${s === 'waiting' ? 'alert' : ''} ${c.agents.length ? '' : 'single'}" data-session="${esc(c.sessionId)}" tabindex="0">${left}${right}</article>`
}

function agentRow(c, a) {
  const s = agentState(a)
  const what = s === 'ended' ? '' : (a.waiting ?? a.tool ?? '')
  return `<div class="agent" data-agent="${esc(a.id)}" data-session="${esc(c.sessionId)}" tabindex="0">
    ${dot(s)}<span class="who">${esc(a.type)} <span class="muted">· ${esc(a.label)}</span></span>${badge(s, t().state[s])}<time>${elapsed(a)}</time>
    ${what ? `<div class="what">▸ ${esc(what)}</div>` : ''}
  </div>`
}

function listPage(sessions) {
  const L = t()
  if (!sessions.length) return `<div class="empty">${L.noSessions}</div>`
  const shown = sessions.filter(c => filter === 'all' || live(c) === filter)
  if (!shown.length) return `<div class="empty">${L.noMatch}</div>`
  return shown.map(card).join('')
}

function crumbs(parts) {
  return `<nav class="crumbs"><button data-go="list">← ${esc(t().allSessions)}</button>${parts.map(p => `<span>/</span>${p}`).join('')}</nav>`
}

function sessionPage() {
  const L = t(), c = board.sessions.find(x => x.sessionId === route.sessionId)
  if (!c) { route = { view: 'list' }; return listPage(board.sessions) }
  const s = live(c)
  const rows = [[L.folder, pretty(c.cwd)], [L.state2, L.state[c.state]], [L.for, { html: tick(c.since, 'plain') }]]
  if (c.state === 'waiting' && c.waiting) rows.push([L.waitingOn, c.waiting])
  if (c.state === 'running' && c.tool) rows.push([L.doing, c.tool])
  rows.push([L.id, c.sessionId])
  return `${crumbs([`<span>${esc(c.title || folderName(c.cwd))}</span>`])}
    <div class="page-head">${dot(s, true)}<h2>${esc(c.title || folderName(c.cwd))}</h2>${badge(s)}
      ${c.hostId ? `<button class="primary" data-open="${esc(c.hostId)}">${L.open}</button>` : ''}</div>
    ${c.state === 'waiting' ? `<div class="callout" style="margin:0 0 18px"><span class="bang">!</span><div><b>${L.inputRequired}</b><span>${esc(c.waiting ?? L.waitingResp)}</span></div></div>` : ''}
    <dl class="fields">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v?.html ?? esc(v)}</dd>`).join('')}</dl>
    <h3>${L.subagents(c.agents.length)}</h3>
    ${c.agents.length ? `<div class="agents">${c.agents.map(a => agentRow(c, a)).join('')}</div>` : `<div class="empty">${L.noAgents}</div>`}`
}

function agentPage() {
  const L = t(), c = board.sessions.find(x => x.sessionId === route.sessionId)
  const a = c?.agents.find(x => x.id === route.agentId)
  if (!c || !a) { route = c ? { view: 'session', sessionId: c.sessionId } : { view: 'list' }; return c ? sessionPage() : listPage(board.sessions) }
  const s = agentState(a), d = details.get(`${c.sessionId}/${a.id}`) ?? { loading: true }
  const time = iso => { try { return new Date(iso).toTimeString().slice(0, 8) } catch { return '' } }
  let body
  if (d.loading) body = `<div class="empty">${L.loading}</div>`
  else if (d.error) body = `<div class="empty"><span class="ended">${L.unreadable}</span><br><span class="faint" style="font-size:12px">${esc(d.error)}</span></div>`
  else body = `${d.prompt ? `<h3>${L.task}</h3><pre class="prose">${esc(d.prompt)}</pre>` : ''}
    <h3>${L.tools}</h3>
    <div class="timeline">${d.tools?.length ? d.tools.slice().reverse().map(x => `<div><time>${time(x.at)}</time><b>${esc(x.name)}</b><span>${esc(x.detail)}</span></div>`).join('') : `<div><span>${L.nothing}</span></div>`}</div>
    <h3>${L.words}</h3><pre class="prose">${esc(d.answer || L.nothing)}</pre>`
  return `${crumbs([`<button data-go="session" data-session="${esc(c.sessionId)}">${esc(c.title || folderName(c.cwd))}</button>`, `<span>${esc(a.type)}</span>`])}
    <div class="page-head">${dot(s, true)}<h2>${esc(a.type)} <span class="muted">· ${esc(a.label)}</span></h2>${badge(s)}
      <span class="muted">${elapsed(a)}</span>
      ${c.hostId ? `<button class="primary" data-open="${esc(c.hostId)}">${L.open}</button>` : ''}</div>
    ${s !== 'ended' && (a.waiting || a.tool) ? `<p class="muted" style="margin:-6px 0 18px">▸ ${esc(a.waiting ?? a.tool)}</p>` : ''}
    ${body}`
}

function sidebar(sessions, counts) {
  const L = t()
  const filters = FILTERS.map((f, i) => `<button class="filter ${filter === f && route.view === 'list' ? 'on' : ''}" data-filter="${f}">
      ${f === 'all' ? `<span class="kbd" style="min-width:20px;height:20px;font-size:10px">${i + 1}</span>` : dot(f)}
      <span>${f === 'all' ? L.all : L.state[f]}</span><span class="n">${f === 'all' ? sessions.length : counts[f]}</span></button>`).join('')
  return `<section><h4>${L.filters}</h4>${filters}</section>
    <section><h4>${L.settings}</h4>
      <button class="setting" data-action="lang"><span>◍</span><span>${L.language}</span><span class="v">${L.langName} ›</span></button>
      <button class="setting" data-action="rate"><span>⟳</span><span>${L.refreshSetting}</span><span class="v">${rate ? rate / 1000 + 's' : L.off} ›</span></button>
    </section>
    <section><h4>${L.shortcuts}</h4>
      <div class="shortcut"><span class="kbd">R</span>${L.refresh}</div>
      <div class="shortcut"><span class="kbd">L</span>${L.toggleLang}</div>
      <div class="shortcut"><span class="kbd">1-5</span>${L.filterKeys}</div>
      <div class="shortcut"><span class="kbd">Esc</span>${L.back}</div>
    </section>
    <div class="about"><b><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.5"/></svg>Agent Watch</b>
      v${esc(board?.version ?? '')}<br>${L.openSource}
      <a href="https://github.com/TheoGegout/claude-agent-watch" target="_blank" rel="noopener">github.com/TheoGegout/claude-agent-watch ↗</a></div>`
}

/* ── events ─────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-open],[data-agent],[data-go],[data-filter],[data-action],[data-session],#refresh-rate,#lang-btn')
  if (!el) return
  if (el.id === 'refresh-rate' || el.dataset.action === 'rate') { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; store('aw.rate', String(rate)); schedule(); return render() }
  if (el.id === 'lang-btn' || el.dataset.action === 'lang') { lang = lang === 'fr' ? 'en' : 'fr'; store('aw.lang', lang); return render() }
  if (el.dataset.open) { e.stopPropagation(); return openSession(el.dataset.open) }
  if (el.dataset.filter) { filter = filter === el.dataset.filter && el.closest('#tally') ? 'all' : el.dataset.filter; return go({ view: 'list' }) }
  if (el.dataset.go === 'list') return go({ view: 'list' })
  if (el.dataset.agent) return go({ view: 'agent', sessionId: el.dataset.session, agentId: el.dataset.agent })
  if (el.dataset.session) return go({ view: 'session', sessionId: el.dataset.session })
})
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return
  const k = e.key.toLowerCase()
  if (k === 'enter' && document.activeElement?.matches('[data-session],[data-agent]')) return document.activeElement.click()
  if (k === 'r') return refresh()
  if (k === 'l') { lang = lang === 'fr' ? 'en' : 'fr'; store('aw.lang', lang); return render() }
  if (k === 'escape' || k === 'b') return go(route.view === 'agent' ? { view: 'session', sessionId: route.sessionId } : { view: 'list' })
  const n = Number(k); if (n >= 1 && n <= 5) { filter = FILTERS[n - 1]; go({ view: 'list' }) }
})
function routeFromHash() {
  const [kind, a, b] = location.hash.slice(1).split('/').map(decodeURIComponent)
  if (kind === 's' && a) return { view: 'session', sessionId: a }
  if (kind === 'a' && a && b) return { view: 'agent', sessionId: a, agentId: b }
  return { view: 'list' }
}
route = routeFromHash()
if (route.view === 'agent') loadDetail(route.sessionId, route.agentId)
const followUrl = () => {
  const to = routeFromHash()
  if (JSON.stringify(to) !== JSON.stringify(route)) go(to)
}
window.addEventListener('hashchange', followUrl)
window.addEventListener('popstate', followUrl)
refresh(); schedule()
setInterval(updateTicks, 1000) // the clocks tick between refreshes
</script>
</body>
</html>
